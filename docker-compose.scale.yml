# Several backend instances behind nginx (docs/operations.md, "Several instances"):
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml up --build -d --scale backend=2
#   infra/seed/seed.sh && infra/scale-demo.sh
#
# The load balancer takes port 8080; the replicas share Kafka (one consumer group), Postgres and Redis.
services:
  backend:
    ports: !reset []
    expose: ["8080"]

  lb:
    image: nginx:1.27-alpine
    ports: ["8080:8080"]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend: { condition: service_started }
