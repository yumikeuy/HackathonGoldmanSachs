# Load balancer for the multi-instance demo (docker-compose.scale.yml): round robin over all backend replicas,
# WebSocket (/ws) upgraded and kept open.
events {}

http {
    upstream backend {
        # Docker DNS returns every replica of the "backend" service; resolved when nginx starts
        server backend:8080;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8080;
        client_max_body_size 11m;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            add_header X-Upstream $upstream_addr always;
        }
    }
}
