# Значения по умолчанию — для запуска из IDE при поднятой инфраструктуре:
#   docker compose up postgres kafka redis mailhog
# В docker-compose хосты переопределяются переменными окружения.
spring:
  application:
    name: alerting-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/alerts?reWriteBatchedInserts=true
    username: ${DB_USER:alerts}
    password: ${DB_PASSWORD:alerts}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.batch_size: 100
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
    consumer:
      group-id: alerting-processor
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 500
    listener:
      ack-mode: manual
      concurrency: ${KAFKA_CONCURRENCY:6}
  mail:
    host: ${MAIL_HOST:localhost}
    port: 1025

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
