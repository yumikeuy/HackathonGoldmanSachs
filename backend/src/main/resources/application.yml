# Значения по умолчанию — для запуска из IDE при поднятой инфраструктуре:
#   docker compose up postgres kafka redis mailhog
# В docker-compose хосты переопределяются переменными окружения.
spring:
  application:
    name: alerting-service
  datasource:
    # statement_timeout 5 s, lock_timeout 2 s (AGENTS.md §6 "DB protection")
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/alerts?reWriteBatchedInserts=true&options=-c%20statement_timeout%3D5000%20-c%20lock_timeout%3D2000
    username: ${DB_USER:alerts}
    password: ${DB_PASSWORD:alerts}
    hikari:
      maximum-pool-size: 20
      connection-timeout: 3000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.batch_size: 100
      hibernate.order_inserts: true
      hibernate.order_updates: true
      # Serialize JSONB columns with Jackson 3 (tools.jackson). Without this Hibernate prefers Jackson 2
      # whenever it is on the classpath transitively (e.g. in tests via kafka-server).
      hibernate.type.json_format_mapper: jackson3
  mvc:
    # Errors are returned as RFC 9457 problem+json (see common.web)
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Runbook upload limit (AGENTS.md §4)
      max-file-size: 10MB
      max-request-size: 11MB
  flyway:
    locations: classpath:db/migration
    # New migrations are named by timestamp (V20261121_1430__rules_add_x.sql) so parallel branches
    # never clash on version numbers; out-of-order lets a branch merged later still apply its older version.
    out-of-order: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      timeout: 2s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    producer:
      acks: all
      # Fail fast when Kafka is down: POST /api/ingest answers 503 instead of hanging.
      properties:
        max.block.ms: 3000
        request.timeout.ms: 3000
        delivery.timeout.ms: 5000
    consumer:
      group-id: alerting-processor
      enable-auto-commit: false
      auto-offset-reset: earliest
      max-poll-records: 500
    listener:
      ack-mode: manual
      concurrency: ${KAFKA_CONCURRENCY:6}
  mail:
    host: ${MAIL_HOST:localhost}
    port: 1025
    properties:
      mail.smtp.connectiontimeout: 3000
      mail.smtp.timeout: 3000
      mail.smtp.writetimeout: 3000

management:
  endpoints:
    web:
      exposure:
        # info is not exposed; health shows no details to anonymous callers (docs/security.md)
        include: health,prometheus
  endpoint:
    health:
      show-details: never

alerting:
  dev:
    # POST /api/dev/generate — the test event generator (Role 2). Switch off in production.
    generator-enabled: ${DEV_GENERATOR_ENABLED:true}
  # Base URL used in notification links (runbook files)
  public-url: ${PUBLIC_URL:http://localhost:8080}
  ingest:
    # How long POST /api/ingest waits for the Kafka acknowledgement before answering 503
    send-timeout: 5s
    # Limits against hostile events (docs/security.md): larger bodies → 413, deeper JSON → 400
    max-body-size: 1MB
    max-json-depth: 64
    # Events per second per HTTP source (Redis rl:ingest:{source}); over it → 429. 0 disables.
    rate-limit-per-second: ${INGEST_RATE_LIMIT:1000}
  security:
    # Browser origins allowed to call /api and open /ws cross-origin (the UI served by the service is same-origin).
    # Comma-separated patterns.
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
  file-source:
    # How often file sources (type "file") check their file for new lines
    poll-interval: 500ms
  outbox:
    poll-interval: 500ms
    cleanup-cron: "0 0 * * * *"
  mail:
    from: alerts@alerting.local
