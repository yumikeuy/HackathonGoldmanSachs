openapi: 3.1.0
info:
  title: Alerting & Notification Service API
  version: 0.1.0
  description: |
    Contract between the React UI (Role 4) and the backend (Roles 1–3). The UI mocks this file until the
    backend is ready; the backend implementation is checked against it via springdoc (`/v3/api-docs`).
    Changing it: the owning role edits this file and announces it in the team chat **before** merging.

    Conventions
    - JSON field names are camelCase. Timestamps are ISO-8601 UTC strings (`2026-11-21T00:17:03.120Z`).
    - Errors are RFC 9457 `application/problem+json` (`Problem`); `detail` is human-readable and safe to show.
    - Lists are keyset-paginated: `?cursor=&limit=` → `{ items, nextCursor }`. `nextCursor` is opaque and
      `null` on the last page. Default limit 50, max 200.
    - No authentication. Where an actor is needed (ack/resolve) the UI sends the user's email.
    - `x-planned: true` on an operation: specified but **not implemented yet** — the UI uses its mock. The owning role
      removes the marker in the same PR that implements the endpoint; a contract test checks implemented ⇔ not planned.

    Live updates (STOMP over plain WebSocket at `/ws`, no SockJS; the UI only subscribes):
    | Destination | Body | Owner |
    |---|---|---|
    | `/topic/alerts/{teamId}` | `AlertSummary` — sent on create and on every change (count, status), at most once per second per alert | Role 2 |
    | `/topic/unrouted` | `AlertSummary` of an UNROUTED alert (`teamId` null, severity `UNKNOWN`) | Role 2 |
    | `/topic/simulator` | `Delivery` — every delivery attempt | Role 1 |
servers:
  - url: http://localhost:8080
security:
  - {}
  - bearerAuth: []
tags:
  - name: ingest
    description: Role 1
  - name: config
    description: Sources, teams, users — Role 1
  - name: simulator
    description: Delivery simulator — Role 1
  - name: auth
    description: UI login (JWT access + refresh tokens) — Role 1
  - name: rules
    description: Role 2
  - name: alerts
    description: Role 2 (audit endpoint — Role 3)
  - name: runbooks
    description: Role 3
  - name: dev
    description: Test event generator — Role 2

paths:
  # ------------------------------------------------------------------ ingest (Role 1)
  /api/ingest/{source}:
    post:
      tags: [ingest]
      summary: Accept an event of any JSON shape
      description: |
        Responds 202 only after Kafka acknowledged the envelope. Limits: body ≤ 1 MB (413), JSON nesting ≤ 64 (400),
        ≤ 1000 events/s per source (429 with `Retry-After`). A source with an API key requires `X-Api-Key` (401).
      parameters:
        - name: source
          in: path
          required: true
          description: Name of an active source (`sources.name`).
          schema: { type: string, example: payments-monitoring }
        - name: X-Api-Key
          in: header
          required: false
          description: The source's API key — required only if one was generated (`POST /api/sources/{id}/api-key`).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { description: Any JSON value. }
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The source requires an API key and `X-Api-Key` is missing or wrong
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: Body larger than 1 MB
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: The source exceeded its rate limit — retry after `Retry-After` seconds
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '503':
          description: Kafka unavailable — retry later
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/ingest/lag:
    get:
      tags: [ingest]
      summary: Consumer lag of the event processor
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IngestLag' }
  /api/fields:
    get:
      tags: [ingest]
      summary: Field paths seen in recent events, for condition autocompletion
      description: IDs, timestamps and fields of strict teams are not suggested (`suggested = false`).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FieldInfo' }
  /api/events/failed:
    get:
      tags: [ingest]
      summary: Events whose processing failed (newest first)
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FailedEventPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/events/{eventId}/replay:
    post:
      tags: [ingest]
      summary: Send a failed event through processing again
      parameters:
        - name: eventId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '202': { description: Re-queued }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ sources, teams, users (Role 1)
  /api/sources:
    get:
      tags: [config]
      summary: All sources
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Source' }
    post:
      tags: [config]
      summary: Create a source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/sources/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [config]
      summary: One source
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [config]
      summary: Replace a source
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SourceInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [config]
      summary: Delete a source
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/sources/{id}/api-key:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [config]
      summary: Generate (or rotate) the API key of an http source
      description: |
        From now on `POST /api/ingest/{name}` requires the key in `X-Api-Key`. The key is returned **only in this
        response**; the server stores its SHA-256.
      responses:
        '201':
          description: The new key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [config]
      summary: Remove the API key — the source accepts events without a key again
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/teams:
    get:
      tags: [config]
      summary: All teams
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Team' }
    post:
      tags: [config]
      summary: Create a team
      description: The condition is validated; an invalid one returns 400 with the reason in `detail`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/teams/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [config]
      summary: One team
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [config]
      summary: Replace a team
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TeamInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Team' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [config]
      summary: Delete a team
      description: 409 while users, rules or alerts still reference it.
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /api/users:
    get:
      tags: [config]
      summary: Users, optionally of one team
      parameters:
        - name: teamId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }
    post:
      tags: [config]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/users/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [config]
      summary: One user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [config]
      summary: Replace a user
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [config]
      summary: Delete a user
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ simulator (Role 1)
  /api/simulator/deliveries:
    get:
      tags: [simulator]
      summary: Delivery attempts, newest first
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/simulator/channels:
    get:
      tags: [simulator]
      summary: Whether each simulated channel is up
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ChannelState' }
  /api/simulator/channels/{channel}/toggle:
    post:
      tags: [simulator]
      summary: Switch a simulated channel down/up
      description: While a channel is down its deliveries are retried; nothing is lost when it comes back.
      parameters:
        - name: channel
          in: path
          required: true
          schema: { $ref: '#/components/schemas/Channel' }
      responses:
        '200':
          description: New state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChannelState' }

  # ------------------------------------------------------------------ auth (Role 1)
  /api/auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password
      description: |
        Returns a short-lived access token (send it as `Authorization: Bearer …`) and a refresh token.
        Login is **enforced** only when the server runs with `JWT_ENABLED=true`; otherwise tokens are optional.
        Max 10 attempts per email per minute (429).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Logged in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '429':
          description: Too many attempts
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/auth/refresh:
    post:
      tags: [auth]
      summary: Exchange a refresh token for a new pair (the old refresh token stops working)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: New tokens
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401':
          description: Refresh token invalid, expired or already used — log in again
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/auth/logout:
    post:
      tags: [auth]
      summary: Revoke the refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '204': { description: Logged out }
  /api/auth/me:
    get:
      tags: [auth]
      summary: The logged-in user (from the access token)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401':
          description: Not logged in
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /api/auth/runbook-links/{runbookId}:
    get:
      tags: [auth]
      summary: A signed link to a runbook file, valid 5 minutes — to open it in a new tab without the token
      parameters:
        - name: runbookId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Signed link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SignedLink' }

  # ------------------------------------------------------------------ rules (Role 2)
  /api/rules:
    get:
      tags: [rules]
      summary: Rules, optionally of one team, in priority order
      parameters:
        - name: teamId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Rule' }
    post:
      tags: [rules]
      summary: Create a rule (effective immediately, no restart)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/rules/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [rules]
      summary: One rule
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [rules]
      summary: Replace a rule
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RuleInput' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [rules]
      summary: Delete a rule
      description: 409 while alerts reference it — deactivate it instead (`active = false`).
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/rules/dry-run:
    post:
      tags: [rules]
      summary: Evaluate a condition against the last 1000 events (preview in the condition builder)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DryRunRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DryRunResult' }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ------------------------------------------------------------------ alerts (Role 2; audit — Role 3)
  /api/alerts:
    get:
      tags: [alerts]
      summary: Alert feed, most recently seen first
      description: Pass `teamId` for a team feed, or `unrouted=true` for alerts no team matched. Exactly one of them.
      parameters:
        - name: teamId
          in: query
          schema: { type: integer, format: int64 }
        - name: unrouted
          in: query
          schema: { type: boolean, default: false }
        - name: status
          in: query
          description: Filter by status; repeat for several (`status=OPEN&status=ACKED`).
          schema:
            type: array
            items: { $ref: '#/components/schemas/AlertStatus' }
          style: form
          explode: true
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertPage' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /api/alerts/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [alerts]
      summary: Alert card
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/alerts/{id}/ack:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [alerts]
      summary: Acknowledge (OPEN → ACKED; repeating is a no-op)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActorRequest' }
      responses:
        '200':
          description: Updated alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /api/alerts/{id}/resolve:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    post:
      tags: [alerts]
      summary: Resolve (OPEN/ACKED → RESOLVED; repeating is a no-op)
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActorRequest' }
      responses:
        '200':
          description: Updated alert
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/alerts/{id}/audit:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [alerts]
      summary: Alert history, oldest first (Role 3)
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/alerts/{id}/team-suggestions:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [alerts]
      summary: Teams an UNROUTED alert probably belongs to, best first (Role 2)
      description: |
        Helps triage on the unrouted page ("create rule from this event"): ranks teams by how close the
        alert's sample event comes to each team's condition and by the history of the event's source.
        Returns an empty list for alerts that already have a team, and at most 5 suggestions.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                maxItems: 5
                items: { $ref: '#/components/schemas/TeamSuggestion' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ runbooks (Role 3)
  /api/runbooks:
    get:
      tags: [runbooks]
      summary: Runbooks without file contents
      description: With `teamId` — that team's runbooks plus global ones; without — all.
      parameters:
        - name: teamId
          in: query
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Runbook' }
    post:
      tags: [runbooks]
      summary: Upload a runbook file of any format (max 10 MB)
      description: |
        With login enforced: ADMIN for any runbook; OPERATOR for runbooks of their own team only — global runbooks,
        other teams' runbooks and moving a runbook to another team or making it global are 403.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RunbookUpload' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Not allowed for this role or team (see the description) }
        '413': { description: File larger than 10 MB }
  /api/runbooks/{id}:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runbooks]
      summary: Runbook metadata
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [runbooks]
      summary: Update team, condition and optionally replace the file
      description: |
        With login enforced: ADMIN for any runbook; OPERATOR for runbooks of their own team only — global runbooks,
        other teams' runbooks and moving a runbook to another team or making it global are 403.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/RunbookUpdate' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Runbook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Not allowed for this role or team (see the description) }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [runbooks]
      summary: Delete a runbook (alerts and rules referencing it lose the link)
      description: |
        With login enforced: ADMIN for any runbook; OPERATOR for runbooks of their own team only — global runbooks,
        other teams' runbooks and moving a runbook to another team or making it global are 403.
      responses:
        '204': { description: Deleted }
        '403': { description: Not allowed for this role or team (see the description) }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/runbooks/{id}/file:
    parameters: [{ $ref: '#/components/parameters/Id' }]
    get:
      tags: [runbooks]
      summary: Download the file as uploaded
      description: '`Content-Type` derived from the file extension; `Content-Disposition: inline; filename=…`.'
      responses:
        '200':
          description: The file
          content:
            '*/*':
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ dev (Role 3)
  /api/dev/generate:
    post:
      tags: [dev]
      summary: Generate test events through the normal ingest path
      description: |
        Answers 202 at once; events are sent in the background at `ratePerSecond` through the real ingest path
        (Kafka, recent events, field catalog) — they behave exactly like events posted to `/api/ingest/{source}`.
        At most 4 runs at a time. The endpoint exists only while `alerting.dev.generator-enabled=true`
        (env `DEV_GENERATOR_ENABLED`); otherwise 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GenerateRequest' }
      responses:
        '202':
          description: Generation started
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GenerateAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: 4 generations are already running — try again later
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from `POST /api/auth/login` (15 min). Required on `/api/**` only when the server runs with
        `JWT_ENABLED=true`: GET → VIEWER, ack/resolve/replay and runbooks of the own team → OPERATOR,
        every other change → ADMIN.
        WebSocket: send it as the STOMP CONNECT header `Authorization: Bearer …`.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Cursor:
      name: cursor
      in: query
      description: '`nextCursor` of the previous page; omit for the first page.'
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }

  responses:
    BadRequest:
      description: Invalid request (e.g. malformed condition, invalid JSON, bad cursor)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Conflicts with existing data (duplicate name, still referenced, invalid state)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details.
      properties:
        type: { type: string, example: about:blank }
        title: { type: string, example: Bad Request }
        status: { type: integer, example: 400 }
        detail: { type: string, example: "Unknown operator 'equals' at $.and[1]" }
        instance: { type: string, example: /api/rules }

    # ---------------- enums
    Severity:
      type: string
      description: Assignable by a rule.
      enum: [LOW, MEDIUM, HIGH, CRITICAL]
    AlertSeverity:
      type: string
      description: '`UNKNOWN` only for UNROUTED alerts.'
      enum: [UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL]
    AlertStatus:
      type: string
      enum: [OPEN, ACKED, RESOLVED]
    Channel:
      type: string
      enum: [EMAIL, SMS, CALL, UI]
    SourceType:
      type: string
      enum: [http, kafka, file]
    GroupMode:
      type: string
      description: '`while_open` — repeats join the alert while it is open; `per_window` — each dedup window opens a new alert.'
      enum: [while_open, per_window]
    Operator:
      type: string
      enum: ['==', '!=', '>', '>=', '<', '<=', in, not_in, contains, regex, glob, exists]

    # ---------------- condition tree (AGENTS.md §5)
    Condition:
      description: Condition tree. `null` where allowed means "no condition" (see the owning field).
      oneOf:
        - $ref: '#/components/schemas/AndCondition'
        - $ref: '#/components/schemas/OrCondition'
        - $ref: '#/components/schemas/LeafCondition'
      example:
        and:
          - or:
              - { path: metric, op: '==', value: cpu }
              - { path: metric, op: '==', value: memory }
          - { path: value, op: '>', value: 90 }
          - { path: host, op: glob, value: 'prod-*' }
    AndCondition:
      type: object
      required: [and]
      properties:
        and:
          type: array
          items: { $ref: '#/components/schemas/Condition' }
    OrCondition:
      type: object
      required: [or]
      properties:
        or:
          type: array
          items: { $ref: '#/components/schemas/Condition' }
    LeafCondition:
      type: object
      required: [path, op]
      description: >
        Single field predicate. Unknown properties are rejected with HTTP 400.
        A missing field or a field whose JSON value is `null` counts as absent:
        every comparison (including `!=` and `not_in`) evaluates to `false`,
        `exists` with `value: true` evaluates to `false`, and `exists` with `value: false`
        evaluates to `true`.
      properties:
        path: { type: string, example: trade.notional }
        op: { $ref: '#/components/schemas/Operator' }
        value:
          description: Comparison value — string, number, boolean, or an array for `in`/`not_in`; for `exists`, `true` (default if omitted) checks presence and `false` checks absence (including JSON `null`).

    # ---------------- ingest
    IngestAccepted:
      type: object
      required: [eventId, ingestedAt]
      properties:
        eventId: { type: string, format: uuid }
        ingestedAt: { type: string, format: date-time }
    IngestLag:
      type: object
      required: [groupId, totalLag, partitions]
      properties:
        groupId: { type: string, example: alerting-processor }
        totalLag: { type: integer, format: int64 }
        partitions:
          type: array
          items:
            type: object
            required: [topic, partition, lag]
            properties:
              topic: { type: string, example: events.ingest }
              partition: { type: integer }
              lag: { type: integer, format: int64 }
    FieldInfo:
      type: object
      required: [path, type, cardinality, suggested]
      properties:
        path: { type: string, example: trade.notional }
        type:
          type: string
          enum: [string, number, boolean, object, array, null]
        cardinality:
          type: integer
          format: int64
          description: Approximate number of distinct values in the last 24 h.
        suggested:
          type: boolean
          description: Whether to offer the field in autocompletion (IDs and timestamps are not).
    FailedEvent:
      type: object
      required: [eventId, sourceName, ingestedAt, status, rawPayload]
      properties:
        eventId: { type: string, format: uuid }
        sourceName: { type: string }
        ingestedAt: { type: string, format: date-time }
        status:
          type: string
          enum: [FAILED, UNROUTED]
        error: { type: [string, 'null'] }
        rawPayload: { description: The event as received. }
        alertId: { type: [integer, 'null'], format: int64 }
    FailedEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/FailedEvent' }
        nextCursor: { type: [string, 'null'] }

    # ---------------- sources, teams, users
    Source:
      allOf:
        - $ref: '#/components/schemas/SourceInput'
        - type: object
          required: [id, createdAt, apiKeyRequired]
          properties:
            id: { type: integer, format: int64 }
            apiKeyRequired: { type: boolean, description: 'Whether `POST /api/ingest/{name}` needs `X-Api-Key`.' }
            createdAt: { type: string, format: date-time }
    SourceApiKey:
      type: object
      required: [sourceName, apiKey, header]
      properties:
        sourceName: { type: string, example: payments-monitoring }
        apiKey: { type: string, description: Shown once — store it in the sending system., example: src_q0J8vR... }
        header: { type: string, example: X-Api-Key }
    SourceInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, maxLength: 100, example: payments-monitoring }
        type: { $ref: '#/components/schemas/SourceType' }
        config:
          type: object
          description: |
            Type-specific settings:
            - `kafka`: `{"topic": "workflow.events"}` — consume this external topic;
            - `file`: `{"path": "/data/logs/app.log", "pattern": "(?<level>[A-Z]+) (?<service>[\\w-]+): .*"}` — tail this
              file (path inside the backend container); each new line is one event: a JSON line as is; a line matching
              the optional `pattern` (Java regex with named groups) as its groups plus `message`; any other line as
              `{"message": "<line>"}`. An invalid pattern or one without named groups → 400;
            - `http`: `{}` — events arrive at `POST /api/ingest/{name}`.
          default: {}
        active: { type: boolean, default: true }
    Team:
      allOf:
        - $ref: '#/components/schemas/TeamInput'
        - type: object
          required: [id, createdAt]
          properties:
            id: { type: integer, format: int64 }
            createdAt: { type: string, format: date-time }
    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string, maxLength: 100, example: Team Rates }
        condition:
          description: Which events belong to the team; `null` — none.
          oneOf:
            - $ref: '#/components/schemas/Condition'
            - type: 'null'
        strict:
          type: boolean
          default: false
          description: Conditions of the team and its rules use exact paths and types only.
    ChannelPreference:
      type: object
      required: [channel]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        hours:
          type: [string, 'null']
          pattern: '^\d{2}-\d{2}$'
          description: Hour window in the user's time zone, end exclusive; `null` — any time.
          example: 08-20
    WorkingHours:
      type: object
      required: [from, to, days]
      properties:
        from: { type: string, example: '08:00' }
        to: { type: string, example: '20:00' }
        days:
          type: array
          description: ISO days, 1 = Monday … 7 = Sunday.
          items: { type: integer, minimum: 1, maximum: 7 }
          example: [1, 2, 3, 4, 5]
    User:
      allOf:
        - $ref: '#/components/schemas/UserInput'
        - type: object
          required: [id, createdAt, role, canLogIn]
          properties:
            id: { type: integer, format: int64 }
            canLogIn: { type: boolean, description: Has an email and a password. The password itself is never returned. }
            createdAt: { type: string, format: date-time }
    UserInput:
      type: object
      required: [teamId, name]
      properties:
        teamId: { type: integer, format: int64 }
        name: { type: string, maxLength: 100, example: Anna Kowalska }
        email: { type: [string, 'null'], format: email, maxLength: 200 }
        phone: { type: [string, 'null'], maxLength: 30, example: '+48 600 000 000' }
        timezone: { type: string, default: Europe/Warsaw }
        channelPreferences:
          type: array
          description: In descending priority.
          items: { $ref: '#/components/schemas/ChannelPreference' }
          default: []
        workingHours:
          oneOf:
            - $ref: '#/components/schemas/WorkingHours'
            - type: 'null'
        active: { type: boolean, default: true }
        role: { $ref: '#/components/schemas/Role' }
        password:
          type: string
          writeOnly: true
          description: Set or change the UI password (8–72 characters); `""` disables login; omit to keep it.

    # ---------------- auth
    Role:
      type: string
      enum: [VIEWER, OPERATOR, ADMIN]
      default: VIEWER
      description: VIEWER reads; OPERATOR also acks/resolves/replays and manages the runbooks of their own team; ADMIN also changes configuration.
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, example: anna.kowalska@bank.example }
        password: { type: string, format: password }
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string }
    TokenResponse:
      type: object
      required: [accessToken, refreshToken, tokenType, expiresIn, user]
      properties:
        accessToken: { type: string, description: JWT, send as `Authorization: Bearer …` }
        refreshToken: { type: string, description: 'One-time: every refresh returns a new one.' }
        tokenType: { type: string, example: Bearer }
        expiresIn: { type: integer, description: Access token lifetime in seconds, example: 900 }
        user: { $ref: '#/components/schemas/CurrentUser' }
    CurrentUser:
      type: object
      required: [subject, email, name, role]
      properties:
        subject: { type: string, example: 'user:3' }
        email: { type: string }
        name: { type: string }
        role: { $ref: '#/components/schemas/Role' }
        teamId: { type: [integer, 'null'], format: int64 }
    SignedLink:
      type: object
      required: [url, expiresAt]
      properties:
        url: { type: string, example: '/api/runbooks/3/file?exp=1795230000&sig=…' }
        expiresAt: { type: string, format: date-time }

    # ---------------- simulator
    Delivery:
      type: object
      required: [id, alertId, teamId, channel, status, retryCount, payload, createdAt, nextRetryAt]
      properties:
        id: { type: integer, format: int64 }
        alertId: { type: integer, format: int64 }
        teamId: { type: integer, format: int64 }
        userId: { type: [integer, 'null'], format: int64, description: '`null` for the UI channel.' }
        channel: { $ref: '#/components/schemas/Channel' }
        status:
          type: string
          enum: [PENDING, SENT, FAILED]
        retryCount: { type: integer }
        lastError: { type: [string, 'null'] }
        payload:
          type: object
          description: The rendered message (e.g. `subject`, `text`, `runbookUrl`).
        createdAt: { type: string, format: date-time }
        nextRetryAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
    DeliveryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Delivery' }
        nextCursor: { type: [string, 'null'] }
    ChannelState:
      type: object
      required: [channel, enabled]
      properties:
        channel: { $ref: '#/components/schemas/Channel' }
        enabled: { type: boolean }

    # ---------------- rules
    Rule:
      allOf:
        - $ref: '#/components/schemas/RuleInput'
        - type: object
          required: [id, updatedAt]
          properties:
            id: { type: integer, format: int64 }
            updatedAt: { type: string, format: date-time }
    RuleInput:
      type: object
      required: [name, teamId]
      properties:
        name: { type: string, maxLength: 200, example: Rejected large trades }
        teamId: { type: integer, format: int64 }
        condition:
          description: '`null` — every event of the team.'
          oneOf:
            - $ref: '#/components/schemas/Condition'
            - type: 'null'
        priority: { type: integer, default: 100, description: Lower runs first. }
        active: { type: boolean, default: true }
        assignedSeverity:
          allOf: [{ $ref: '#/components/schemas/Severity' }]
          default: MEDIUM
        channels:
          type: array
          items: { $ref: '#/components/schemas/Channel' }
          default: [UI]
        groupByPaths:
          type: array
          description: Event paths whose values identify one alert.
          items: { type: string }
          default: []
          example: [instrument]
        groupMode:
          allOf: [{ $ref: '#/components/schemas/GroupMode' }]
          default: while_open
        dedupWindowSec: { type: integer, minimum: 1, default: 300 }
        presentation:
          type: object
          properties:
            title:
              type: [string, 'null']
              description: Title template with `{{path}}` placeholders; `null` — the rule name.
              example: 'Rejected {{trade.id}} ({{trade.notional}})'
          default: {}
        resolveCondition:
          description: An event matching this resolves the open alert automatically; `null` — never.
          oneOf:
            - $ref: '#/components/schemas/Condition'
            - type: 'null'
        overrideRunbookId:
          type: [integer, 'null']
          format: int64
          description: Always attach this runbook to the rule's alerts.
    DryRunRequest:
      type: object
      required: [condition]
      properties:
        condition: { $ref: '#/components/schemas/Condition' }
        teamId:
          type: [integer, 'null']
          format: int64
          description: If set, the team's `strict` flag applies and only events matching the team condition count.
        strict: { type: boolean, default: false, description: Used when `teamId` is not set. }
        sampleSize: { type: integer, minimum: 0, maximum: 50, default: 10 }
    DryRunResult:
      type: object
      required: [checked, matched, samples]
      properties:
        checked: { type: integer, description: Recent events evaluated (up to 1000). }
        matched: { type: integer }
        samples:
          type: array
          description: Up to `sampleSize` matching raw events.
          items: { description: Raw event. }

    # ---------------- alerts
    AlertSummary:
      type: object
      description: Feed row and WebSocket message body.
      required: [id, severity, status, title, occurrencesCount, firstSeenAt, lastSeenAt]
      properties:
        id: { type: integer, format: int64 }
        teamId: { type: [integer, 'null'], format: int64, description: '`null` for UNROUTED.' }
        ruleId: { type: [integer, 'null'], format: int64 }
        ruleName: { type: [string, 'null'] }
        severity: { $ref: '#/components/schemas/AlertSeverity' }
        status: { $ref: '#/components/schemas/AlertStatus' }
        title: { type: string, maxLength: 500 }
        occurrencesCount: { type: integer, minimum: 1 }
        firstSeenAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }
        runbookId: { type: [integer, 'null'], format: int64 }
    AlertDetail:
      allOf:
        - $ref: '#/components/schemas/AlertSummary'
        - type: object
          required: [samplePayload]
          properties:
            samplePayload: { description: The first event of the group, as received. }
            runbook:
              oneOf:
                - $ref: '#/components/schemas/RunbookLink'
                - type: 'null'
    AlertPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AlertSummary' }
        nextCursor: { type: [string, 'null'] }
    ActorRequest:
      type: object
      properties:
        actor:
          type: string
          description: Who acts (email); defaults to `ui`.
          example: anna@bank.com
    TeamSuggestion:
      type: object
      required: [teamId, teamName, score, reason]
      properties:
        teamId: { type: integer, format: int64 }
        teamName: { type: string }
        score:
          type: number
          minimum: 0
          maximum: 1
          description: Confidence, 1 = best.
        reason:
          type: string
          description: Human-readable explanation shown next to the suggestion.
          example: '3 of 4 conditions match; 120 alerts of this team came from source payments-monitoring'
    AuditEntry:
      type: object
      required: [id, actor, actionType, details, createdAt]
      properties:
        id: { type: integer, format: int64 }
        alertId: { type: [integer, 'null'], format: int64 }
        actor: { type: string, example: anna@bank.com }
        actionType:
          type: string
          description: ALERT_CREATED, ACK, RESOLVE, AUTO_CLOSE, RUNBOOK_ATTACHED, RUNBOOK_DETACHED, … (open list)
        details: { type: object }
        createdAt: { type: string, format: date-time }

    # ---------------- runbooks
    RunbookLink:
      type: object
      required: [id, fileName, fileUrl]
      properties:
        id: { type: integer, format: int64 }
        fileName: { type: string, example: restart-workflow.pdf }
        fileUrl: { type: string, example: /api/runbooks/3/file }
    Runbook:
      allOf:
        - $ref: '#/components/schemas/RunbookLink'
        - type: object
          properties:
            teamId: { type: [integer, 'null'], format: int64, description: '`null` — global.' }
            condition:
              description: When to attach automatically; `null` — only via a rule's `overrideRunbookId`.
              oneOf:
                - $ref: '#/components/schemas/Condition'
                - type: 'null'
    RunbookUpload:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
        teamId: { type: integer, format: int64, description: Omit for a global runbook. }
        condition: { type: string, description: Condition tree as a JSON string; omit for none. }
    RunbookUpdate:
      type: object
      properties:
        file: { type: string, format: binary, description: Omit to keep the current file. }
        teamId: { type: integer, format: int64, description: Omit for a global runbook. }
        condition: { type: string, description: Condition tree as a JSON string; omit for none. }

    # ---------------- dev
    GenerateRequest:
      type: object
      required: [source]
      properties:
        source: { type: string, description: Name of an active source to ingest under (else 400). }
        count: { type: integer, minimum: 1, maximum: 100000, default: 100 }
        ratePerSecond: { type: integer, minimum: 1, maximum: 1000, default: 100 }
        template:
          description: |
            Event to send; omit to cycle through the built-in sample events. String values (at any depth; keys are
            never changed) may contain placeholders, so events vary:
            - `{{seq}}` — number of the event in the run: 1, 2, 3 …
            - `{{uuid}}` — a random UUID
            - `{{now}}` — current time, ISO-8601 UTC
            - `{{randInt:MIN:MAX}}` — random integer, bounds inclusive
            - `{{oneOf:A|B|C}}` — one of the listed values
            A string that is exactly `{{seq}}` or `{{randInt:…}}` becomes a JSON number. Unknown or malformed
            placeholders → 400.
          example:
            type: TRADE_REJECTED
            desk: rates
            instrument: '{{oneOf:EUR-IRS-10Y|USD-IRS-5Y}}'
            trade: { id: 'T-{{seq}}', notional: '{{randInt:1000000:50000000}}' }
    GenerateAccepted:
      type: object
      required: [count]
      properties:
        count: { type: integer }
