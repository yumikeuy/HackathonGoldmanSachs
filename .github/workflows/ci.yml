# CI (owner: Role 1). Every PR and every push to main must stay green:
#   test — mvn test: unit + Testcontainers integration tests (Docker is available on ubuntu runners);
#   e2e  — the real stack: docker compose up --build → infra/seed/seed.sh → infra/smoke.sh (twice: smoke is repeatable).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: mvn test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Test
        working-directory: backend
        run: mvn -B -ntp test
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/

  e2e:
    name: compose → seed → smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Shell scripts parse
        run: bash -n infra/seed/seed.sh && bash -n infra/smoke.sh
      - name: Start the stack
        run: docker compose up --build -d
      - name: Seed
        run: infra/seed/seed.sh
      - name: Smoke
        run: infra/smoke.sh && infra/smoke.sh
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color backend | tail -300
      - name: Stop
        if: always()
        run: docker compose down -v
